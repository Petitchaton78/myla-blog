{% comment %}
  窄屏才显示的顶栏。左边打开菜单，右边打开目录（有标题时由脚本显示）。
{% endcomment %}
<header class="book-header">
  <div class="flex align-center justify-between">
    <label for="menu-control" aria-label="打开菜单">
      <svg class="book-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
    </label>
    <strong><a class="mobile-brand" href="{{ '/' | relative_url }}"><img class="site-mark" src="{{ '/assets/logo.svg' | relative_url }}" alt="" width="26" height="26"><span>{{ site.title }}</span></a></strong>
    <label for="toc-control" class="toc-toggle" aria-label="打开目录">
      <svg class="book-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 6h10v2H4V6zm0 5h16v2H4v-2zm0 5h12v2H4v-2z"/></svg>
    </label>
  </div>
  <aside class="mobile-toc">
    <nav id="TableOfContentsMobile" aria-label="目录"></nav>
  </aside>
</header>
