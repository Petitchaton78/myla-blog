---
layout: default
title: 归档
permalink: /archive/
---
<article class="markdown">
  <h1>归档</h1>
  {% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
  {% for year in years %}
    <section class="year-block">
      <h2>{{ year.name }}</h2>
      <ul class="archive-list">
        {% for post in year.items %}
          {% include compact-item.html post=post %}
        {% endfor %}
      </ul>
    </section>
  {% endfor %}
</article>
