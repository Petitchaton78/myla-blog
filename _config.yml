# 站点配置。改标题、简介、域名时，优先改这里。
# 改完需要重新构建；GitHub Pages 会在推送到 main 后自动构建。

title: Myla's Blog
# 首页浏览器标题里跟在站名后面的短句，例如「Myla's Blog | 个人笔记」。
# 不想要这截后缀时，删掉 tagline 即可；此时标题会改用下面的 description。
tagline: 个人笔记
# 首页标题下方的那一句，也会进 RSS 和搜索结果的摘要。
description: 写给自己看的笔记，也留给偶尔路过的人。
# 作者名会出现在 RSS 里。换成你自己的名字即可。
author: Myla

# 正式站点地址。RSS 和 canonical 链接靠它拼绝对地址。
# 本地预览时 Jekyll 仍用 localhost，不受这个值影响。
url: https://blog.myla.monster
baseurl: ""

# 页面语言。html 标签写死为 zh-CN（见 _layouts/default.html）。
# 这里用下划线，是因为 Open Graph 的 og:locale 要求 zh_CN 这种写法。
lang: zh_CN
timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 文章地址形如 /2026/11/02/title/
# 页面地址形如 /about/
permalink: pretty

plugins:
  - jekyll-feed
  - jekyll-seo-tag

# RSS 输出到网站根目录的 /feed.xml
feed:
  path: feed.xml

# 这些文件只给人看或只给本地构建用，不要进发布结果。
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
