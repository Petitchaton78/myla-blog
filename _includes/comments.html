{% comment %}
  giscus 读 GitHub Discussions。repo 和 repo_id 都填了才加载脚本。
{% endcomment %}
<div class="book-comments">
  <div class="markdown-inner">
    {% if site.giscus.repo != "" and site.giscus.repo_id != "" and site.giscus.category_id != "" %}
      <div id="giscus"></div>
      <script src="https://giscus.app/client.js"
        data-repo="{{ site.giscus.repo }}"
        data-repo-id="{{ site.giscus.repo_id }}"
        data-category="{{ site.giscus.category }}"
        data-category-id="{{ site.giscus.category_id }}"
        data-mapping="{{ site.giscus.mapping | default: 'pathname' }}"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="{{ site.giscus.lang | default: 'zh-CN' }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async></script>
    {% else %}
      <blockquote class="book-hint info" id="giscus-placeholder">
        评论位已留好，用的是 giscus。在 <code>_config.yml</code> 的 <code>giscus</code> 里填上
        <code>repo</code>、<code>repo_id</code>、<code>category_id</code> 之后，这里会变成评论框。
      </blockquote>
    {% endif %}
  </div>
</div>
