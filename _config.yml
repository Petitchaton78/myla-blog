# 站点级设置。改站名、简介、评论、分页时先看这里。
# 改完如果动过标签、分类，或文章多到新的一页，先跑：
#   ruby script/generate_pages.rb
# GitHub Actions 会在发布前自动跑这一步。

title: Myla's Blog
tagline: 个人笔记
description: 写给自己看的笔记，也留给偶尔路过的人。
author: Myla
# 侧栏站名下面的两行。换成你自己的句子，不要留空数组。
taglines:
  - 写下来，以后还能看懂
  - 一页一页，慢慢来

url: https://blog.myla.monster
baseurl: ""
lang: zh_CN
timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

# 文章地址用日期，不把分类塞进路径，避免中文分类把链接拉得很长。
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag

# /posts/ 每页几篇。改这个数之后要重新跑 script/generate_pages.rb。
list_per_page: 4

# 阅读时间按汉字估算，和常见中文博客一样大约 400 字一分钟。
words_per_minute: 400

# 评论用 giscus（GitHub Discussions）。四个空值填完才会出现评论框。
# 安装说明写在 README。
giscus:
  repo: ""
  repo_id: ""
  category: Announcements
  category_id: ""
  mapping: pathname
  lang: zh-CN

# 文末和首页的支持链接。留空数组时，页面上只显示一段占位说明。
# - title: 请我喝一杯
#   url: https://example.com/tip
support_links: []

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore
  - script
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sample: false
