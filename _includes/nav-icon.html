{% comment %}

{% endcomment %}
<svg class="nav-ico" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" shape-rendering="crispEdges">
  {% case include.name %}
  {% when "archive" %}
    <path fill="currentColor" d="M2 2h12v2H2zm1 3h10v2H3zm0 3h10v2H3zm0 3h10v2H3z"/>
  {% when "rss" %}
    <path fill="currentColor" d="M3 11h2v2H3zm0-4h2v2H3zm4 2h2v2H7zm0-4h2v2H7zm4 4h2v2h-2zM3 3h2v2H3zm8 2h2v2h-2z"/>
  {% when "notes" %}
    <path fill="currentColor" d="M3 2h8v1h1v1h1v10H3V2zm2 4h6v2H5zm0 3h4v2H5z"/>
  {% when "friends" %}
    <path fill="currentColor" d="M2 3h4v3H2zm1 4h2v1H3zm-1 2h4v3H2zm8-6h4v3h-4zm1 4h2v1h-2zm-1 2h4v3h-4z"/>
  {% when "now" %}
    <path fill="currentColor" d="M6 1h4v2H6zM3 4h2v2H3zm8 0h2v2h-2zM3 7h2v3H3zm8 0h2v3h-2zM6 12h4v2H6zM7 4h2v4H7zm2 3h2v2H9z"/>
  {% when "about" %}
    <path fill="currentColor" d="M7 2h2v2H7zm0 4h2v7H7z"/>
  {% else %}
    <path fill="currentColor" d="M2 3h12v2H2zm0 4h12v2H2zm0 4h8v2H2z"/>
  {% endcase %}
</svg>
