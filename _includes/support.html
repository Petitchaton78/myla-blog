{% if site.support_links.size > 0 %}
  <blockquote class="book-hint">
    如果这篇对你有用，也可以从下面的链接支持后续写作：
    {% for link in site.support_links %}
      <a href="{{ link.url }}" target="_blank" rel="noopener">{{ link.title }}</a>
    {% endfor %}
  </blockquote>
{% else %}
  <blockquote class="book-hint">
    还没有支持链接。在 <code>_config.yml</code> 的 <code>support_links</code> 里写上标题和地址，发布后会出现在这里。
  </blockquote>
{% endif %}
