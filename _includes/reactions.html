{% comment %}
  表情计数存在这台浏览器的 localStorage 里。
  参考站用的是它自己的反应服务，静态站点没有那台服务器，所以这里只记在本地。
{% endcomment %}
<div class="engagement">
  <div class="reaction-container" data-reactions>
    <button type="button" data-emoji="like" data-label="喜欢">喜欢</button>
    <button type="button" data-emoji="laugh" data-label="好笑">好笑</button>
    <button type="button" data-emoji="think" data-label="存疑">存疑</button>
    <button type="button" data-emoji="whoa" data-label="没想到">没想到</button>
  </div>
</div>
