# 站点级设置。改站名、简介、评论、分页时先看这里。
# 改完如果动过标签、分类，或文章多到新的一页，先跑：
#   ruby script/generate_pages.rb
# GitHub Actions 会在发布前自动跑这一步。

title: Myla's Blog
tagline: 玩家日志
description: 深圳和香港之间的笔记。金融、游戏、AIGC。
author: Myla
# 侧栏站名下面的两行。
taglines:
  - 深圳 / 香港，双端存档
  - 白天对账，夜里下副本

url: https://blog.myla.monster
baseurl: ""
lang: zh_CN
timezone: Asia/Shanghai

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true

# 文章地址用日期，不把分类塞进路径，避免中文分类把链接拉得很长。
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag

# /posts/ 每页几篇。改这个数之后要重新跑 script/generate_pages.rb。
list_per_page: 4

# 阅读时间按汉字估算，和常见中文博客一样大约 400 字一分钟。
words_per_minute: 400

# 评论用 giscus（GitHub Discussions）。
# theme 不写死成一个值：页面按当前浅色/深色把 theme_light 或 theme_dark 传进去。
giscus:
  repo: Petitchaton78/myla-blog
  repo_id: R_kgDOVj_v_A
  category: Announcements
  category_id: DIC_kwDOVj_v_M4DKe6z
  mapping: pathname
  strict: "0"
  reactions: "1"
  emit_metadata: "0"
  input_position: bottom
  lang: zh-CN
  theme_light: light
  theme_dark: dark

# 文末和首页的支持链接。留空数组时，页面上只显示一段占位说明。
# - title: 请我喝一杯
#   url: https://example.com/tip
support_links: []

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .gitignore
  - script
  - .github

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      sample: false
